name: Test Cross-Repo Push

on:
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repoB
        uses: actions/checkout@v4
        with:
          repository: elifatilganrwth/repoB
          token: ${{ secrets.REPOB_TOKEN }}
          ref: main
          path: gh-pages

      - name: Stage dummy PR preview
        run: |
          cd gh-pages
          mkdir -p pull-requests
          cd pull-requests
          rm -rf "123"
          mkdir -p "123"
          cd "123"
          echo "<h1>Dummy preview for PR 123</h1>" > index.html

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "pull-requests"
          git commit -m "docs: preview for PR #123"
          git push
