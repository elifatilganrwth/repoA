\f0\fs24 \cf0 name: Test Cross-Repo Push\
\
on:\
  workflow_dispatch:\
\
jobs:\
  test-push:\
    runs-on: ubuntu-latest\
\
    steps:\
      - name: Checkout repoB\
        uses: actions/checkout@v4\
        with:\
          repository: elifatilganrwth/repoB\
          token: $\{\{ secrets.REPOB_TOKEN \}\}\
          ref: main\
          path: repoB\
\
      - name: Create test file\
        run: |\
          cd repoB\
          echo "Created by a GitHub Action running in repoA" > action-test.txt\
\
      - name: Commit and push\
        working-directory: repoB\
        run: |\
          git config user.name "github-actions[bot]"\
          git config user.email "github-actions[bot]@users.noreply.github.com"\
          git add action-test.txt\
          git commit -m "Test cross-repository push"\
          git push}